name: Go Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Start Alertmanager
      run: |
        if ss -ltnH 'sport = :19093' | grep -q .; then
          echo "Port 19093 is already in use" >&2
          exit 1
        fi
        curl -fsSL -o alertmanager.tar.gz \
          https://github.com/prometheus/alertmanager/releases/download/v0.33.0/alertmanager-0.33.0.linux-amd64.tar.gz
        tar -xzf alertmanager.tar.gz
        mv alertmanager-0.33.0.linux-amd64 alertmanager
        ./alertmanager/alertmanager \
          --config.file=testdata/alertmanager.yml \
          --web.listen-address=:19093 \
          --storage.path=/tmp/alertmanager &
        echo "ALERTMANAGER_PID=$!" >> "$GITHUB_ENV"
        echo "ALERTMANAGER_URL=http://127.0.0.1:19093" >> "$GITHUB_ENV"
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:19093/api/v2/status > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "Alertmanager did not become ready" >&2
        exit 1

    - name: Run tests
      run: |
        go test -v ./... -coverprofile=coverage.out -covermode=count

    - name: Build container image
      run: docker build --tag alertmanager-route-tester:test .

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.17.3

    - name: Test deployment configuration
      run: bash scripts/test-helm-chart.sh

    - name: Stop Alertmanager
      if: always()
      run: |
        if [ -n "${ALERTMANAGER_PID:-}" ]; then
          kill "$ALERTMANAGER_PID" 2>/dev/null || true
          wait "$ALERTMANAGER_PID" 2>/dev/null || true
        fi

    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false