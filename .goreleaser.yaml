version: 2

# Make sure to check the documentation at https://goreleaser.com
before:
  hooks:
    - go mod tidy
    - go tool otelc go build -o bin/alertmanager-route-tester .
    - go test -v ./...
builds:
  - command: ./scripts/otelc-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    main: ./
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
release:
  github:
    owner: wbollock
    name: alertmanager-route-tester