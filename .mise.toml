[tools]
go = "1.27.1"
"aqua:vercel-labs/agent-browser" = "0.37.1"

[tasks.start]
description = "Start everything needed for local testing (Recommended)"
depends = ["setup", "build"]
run = """
#!/bin/bash
set -e

echo "Starting Alertmanager on :9093..."
./bin/alertmanager/alertmanager \
  --config.file=testdata/alertmanager.yml \
  --web.listen-address=:9093 \
  --storage.path=./data/alertmanager &
ALERTMANAGER_PID=$!

# Wait for Alertmanager to be ready
echo "Waiting for Alertmanager to start..."
for i in {1..30}; do
  if curl -s http://localhost:9093/api/v2/status > /dev/null 2>&1; then
    echo "✓ Alertmanager is ready"
    break
  fi
  sleep 1
done

echo ""
echo "Starting Route Tester on :8080..."
./bin/alertmanager-route-tester -config config.yaml &
APP_PID=$!

# Wait for app to be ready
sleep 2

echo ""
echo "=========================================="
echo "✓ Everything is running!"
echo "=========================================="
echo ""
echo "Alertmanager UI:  http://localhost:9093"
echo "Alertmanager Route Tester:     http://localhost:8080"
echo ""
echo "Press Ctrl+C to stop all services"
echo ""

# Cleanup function
cleanup() {
  echo ""
  echo "Stopping services..."
  kill $APP_PID 2>/dev/null || true
  kill $ALERTMANAGER_PID 2>/dev/null || true
  exit 0
}

trap cleanup INT TERM

# Wait for both processes
wait
"""

[tasks.setup]
description = "Download and setup Alertmanager for local testing"
run = """
#!/bin/bash
set -e

ALERTMANAGER_VERSION="0.33.0"
OS=$(uname -s | tr '[:upper:]' '[:lower:]')
ARCH=$(uname -m)

if [ "$ARCH" = "x86_64" ]; then
    ARCH="amd64"
elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
    ARCH="arm64"
fi

ALERTMANAGER_DIR="./bin/alertmanager"
if [ -x "$ALERTMANAGER_DIR/alertmanager" ] && "$ALERTMANAGER_DIR/alertmanager" --version 2>/dev/null | grep -Fq "version ${ALERTMANAGER_VERSION}"; then
    echo "Alertmanager ${ALERTMANAGER_VERSION} already installed"
    exit 0
fi

mkdir -p ./bin
INSTALL_DIR=$(mktemp -d ./bin/alertmanager-install.XXXXXX)
BACKUP_DIR="$INSTALL_DIR/previous"
cleanup() {
    status=$?
    if [ ! -e "$ALERTMANAGER_DIR" ] && [ -d "$BACKUP_DIR" ]; then
        if ! mv "$BACKUP_DIR" "$ALERTMANAGER_DIR"; then
            echo "Could not restore the existing Alertmanager from $BACKUP_DIR" >&2
            status=1
        fi
    fi
    if [ -e "$ALERTMANAGER_DIR" ] || [ ! -d "$BACKUP_DIR" ]; then
        rm -rf "$INSTALL_DIR" || status=1
    else
        echo "Existing Alertmanager backup retained at $BACKUP_DIR" >&2
    fi
    exit "$status"
}
trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

echo "Downloading Alertmanager ${ALERTMANAGER_VERSION} for ${OS}/${ARCH}..."
TARBALL="alertmanager-${ALERTMANAGER_VERSION}.${OS}-${ARCH}.tar.gz"
URL="https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/${TARBALL}"
curl -fsSL -o "$INSTALL_DIR/$TARBALL" "$URL"
tar -xzf "$INSTALL_DIR/$TARBALL" -C "$INSTALL_DIR"

STAGED_DIR="$INSTALL_DIR/alertmanager-${ALERTMANAGER_VERSION}.${OS}-${ARCH}"
if [ ! -x "$STAGED_DIR/alertmanager" ] || ! "$STAGED_DIR/alertmanager" --version 2>/dev/null | grep -Fq "version ${ALERTMANAGER_VERSION}"; then
    echo "Downloaded Alertmanager is missing or has the wrong version" >&2
    exit 1
fi

if [ -e "$ALERTMANAGER_DIR" ]; then
    mv "$ALERTMANAGER_DIR" "$BACKUP_DIR"
fi
mv "$STAGED_DIR" "$ALERTMANAGER_DIR"
echo "Alertmanager installed successfully"
"""

[tasks.alertmanager]
description = "Run local Alertmanager instance with test config"
depends = ["setup"]
run = """
#!/bin/bash
./bin/alertmanager/alertmanager \
  --config.file=testdata/alertmanager.yml \
  --web.listen-address=:9093 \
  --storage.path=./data/alertmanager
"""

[tasks.dev]
description = "Run the route tester application in development mode"
run = """
#!/bin/bash
go tool otelc go run . -config config.yaml
"""

[tasks.test]
description = "Run unit and Alertmanager integration tests"
depends = ["setup", "build"]
run = """
#!/bin/bash
set -e

ALERTMANAGER_URL="http://localhost:19093"
export ALERTMANAGER_URL
ATR_OTEL_TEST_BINARY="$PWD/bin/alertmanager-route-tester"
export ATR_OTEL_TEST_BINARY
ALERTMANAGER_PID=""
cleanup() {
  if [ -n "$ALERTMANAGER_PID" ]; then
    kill "$ALERTMANAGER_PID" 2>/dev/null || true
    wait "$ALERTMANAGER_PID" 2>/dev/null || true
  fi
}
trap cleanup EXIT INT TERM

if curl -fsS "$ALERTMANAGER_URL/api/v2/status" > /dev/null 2>&1; then
  echo "Alertmanager test port 19093 is already in use" >&2
  exit 1
fi

./bin/alertmanager/alertmanager \
  --config.file=testdata/alertmanager.yml \
  --web.listen-address=:19093 \
  --storage.path=./data/alertmanager-test &
ALERTMANAGER_PID=$!

for i in {1..30}; do
  if curl -fsS "$ALERTMANAGER_URL/api/v2/status" > /dev/null 2>&1; then
    break
  fi
  if ! kill -0 "$ALERTMANAGER_PID" 2>/dev/null; then
    echo "Alertmanager stopped before becoming ready" >&2
    exit 1
  fi
  sleep 1
done

if ! curl -fsS "$ALERTMANAGER_URL/api/v2/status" > /dev/null 2>&1; then
  echo "Alertmanager did not become ready" >&2
  exit 1
fi

go test -v ./... -coverprofile=coverage.out -covermode=count
"""

[tasks.build]
description = "Build the application"
run = "go tool otelc go build -o bin/alertmanager-route-tester ."

[tasks.clean]
description = "Remove local Alertmanager install and data to force re-setup"
run = """
#!/bin/bash
set -e
bash scripts/clean-alertmanager-data.sh
echo "Removed local Alertmanager binaries and data"
"""

[tasks.clean-all]
description = "Clean up all generated files"
run = """
#!/bin/bash
set -e
bash scripts/clean-alertmanager-data.sh
rm -f ./bin/alertmanager-route-tester
rmdir ./bin 2>/dev/null || true
rmdir ./data 2>/dev/null || true
"""
