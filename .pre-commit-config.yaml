default_install_hook_types:
  - pre-commit
  - commit-msg
minimum_pre_commit_version: 3.2.0

repos:
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint format
        entry: mise exec -- golangci-lint fmt --diff
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: mise exec -- golangci-lint run --timeout=5m
        language: system
        types: [go]
        require_serial: true
        pass_filenames: false

      - id: go-test
        name: go test
        entry: mise run test
        language: system
        types: [go]
        require_serial: true
        pass_filenames: false
