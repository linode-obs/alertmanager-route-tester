alertmanager-route-tester:
  server:
    enabled: true
    listen: ":8080"
    read_header_timeout: 5s
    read_timeout: 50.6s
    write_timeout: 50.6s
    idle_timeout: 60s
  cli-test-mode:
    enabled: false # set true to run in CLI test mode instead of web server mode
    format: "simple"
    labels: {} # required when cli-test-mode.enabled is true

alertmanager:
  url: "http://localhost:9093"
  http:
    tls:
      skip_verify: false
      ca_file: ""
      cert_file: ""
      key_file: ""
    timeouts:
      request: 15s
      dial: 5s
      tls_handshake: 5s
      response_header: 10s
      idle_conn: 90s
      expect_continue: 1s
  retry:
    max_attempts: 3
    backoff: 300ms
  pool:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    max_conns_per_host: 0
