{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alertmanager-route-tester.fullname" . }}
  labels:
    {{- include "alertmanager-route-tester.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "alertmanager-route-tester.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- $rules := list }}
  {{- range .Values.networkPolicy.ingress }}
  {{- $rules = append $rules . }}
  {{- end }}
  {{- if .Values.ingress.enabled }}
  {{- $peer := .Values.ingress.networkPolicy | default dict }}
  {{- $namespace := $peer.namespace | default "" }}
  {{- $podLabels := $peer.podLabels | default dict }}
  {{- if and (not $namespace) (empty $podLabels) }}
  {{- fail "ingress.networkPolicy.namespace or ingress.networkPolicy.podLabels is required when ingress.enabled and networkPolicy.enabled are true" }}
  {{- end }}
  {{- $from := dict }}
  {{- if $namespace }}
  {{- $_ := set $from "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $namespace)) }}
  {{- end }}
  {{- if not (empty $podLabels) }}
  {{- $_ := set $from "podSelector" (dict "matchLabels" $podLabels) }}
  {{- end }}
  {{- $rule := dict "from" (list $from) "ports" (list (dict "port" (.Values.service.port | int) "protocol" "TCP")) }}
  {{- $rules = append $rules $rule }}
  {{- end }}
  ingress:
    {{- toYaml $rules | nindent 4 }}
{{- end }}
