---
replicaCount: 1

image:
  repository: ghcr.io/linode-obs/alertmanager-route-tester
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
extraEnv: []

alertmanagers:
  default:
    url: http://alertmanager:9093

service:
  port: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  path: /metrics

networkPolicy:
  enabled: true
  ingress: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi

extraVolumes: []
extraVolumeMounts: []
deploymentAnnotations: {}
extraObjects: []
