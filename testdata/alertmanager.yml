- name: 'slack-customer-alerts'
  webhook_configs:
  - url: 'http://localhost:5001/slack-customer-alerts'
- name: 'team-observability'
  webhook_configs:
  - url: 'http://localhost:5001/team-observability'
- name: 'pagerduty-observability'
  webhook_configs:
  - url: 'http://localhost:5001/pagerduty-observability'
- name: 'team-infra-east'
